<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIP VANTRUST LIQUIDEZ CORRIENTE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif; background: #0d1117;
      color: #e6edf3; display: flex; justify-content: center;
      align-items: flex-start; min-height: 100vh; padding: 40px 20px;
    }
    .container { text-align: center; padding: 0; max-width: 600px; width: 100%; }
    .back { color: #58a6ff; text-decoration: none; font-size: 13px;
             display: inline-block; margin-bottom: 20px; transition: 0.2s; }
    .back:hover { color: #79c0ff; }
    .badge {
      display: inline-block; padding: 4px 12px; border-radius: 20px;
      font-size: 11px; font-weight: bold; background: #1c2d3e;
      color: #58a6ff; border: 1px solid #2d6a9f; margin-bottom: 12px;
    }
    h1 { font-size: 1.8rem; margin-bottom: 10px; color: #58a6ff; line-height: 1.3; }
    p  { color: #8b949e; margin-bottom: 32px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .card {
      background: #161b22; border: 1px solid #30363d; border-radius: 12px;
      padding: 28px 20px; text-decoration: none; color: #e6edf3;
      transition: all 0.2s; display: flex; flex-direction: column;
      align-items: center; cursor: pointer;
    }
    .card:hover {
      border-color: #58a6ff; transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(88,166,255,0.15);
    }
    .card.disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
    .icon { font-size: 2rem; margin-bottom: 10px; }
    .card h2 { font-size: 1rem; }
    .mes-label { font-size: 11px; color: #8b949e; margin-top: 6px; }
    .center-box { display: flex; justify-content: center; margin-top: 20px; }
    .historial-btn { padding: 15px; min-width: 180px; cursor: pointer; }
    .historial-container {
      margin-top: 20px; display: none; animation: fadeIn 0.3s ease;
      background: #161b22; border: 1px solid #30363d;
      border-radius: 12px; padding: 20px;
    }
    .select-group {
      display: flex; gap: 10px; justify-content: center;
      margin-bottom: 15px; flex-wrap: wrap;
    }
    select {
      padding: 10px; border-radius: 8px; border: 1px solid #30363d;
      background: #0d1117; color: #e6edf3; font-size: 13px; cursor: pointer;
    }
    select:focus { outline: none; border-color: #58a6ff; }
    .download-btn {
      padding: 10px 20px; border-radius: 8px; border: none;
      background: #58a6ff; color: #0d1117; cursor: pointer;
      font-size: 13px; font-weight: bold; transition: 0.2s;
    }
    .download-btn:hover { background: #79c0ff; }
    @keyframes fadeIn { from { opacity:0; transform: translateY(-5px); } to { opacity:1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="container">
    <a class="back" href="MenuFF.html">← Volver al menú de Fondos</a>
    <div class="badge">FIP VANTRUST</div>
    <h1>FIP VANTRUST LIQUIDEZ CORRIENTE</h1>
    <p>Descarga los archivos disponibles</p>

    <div class="grid">
      <a class="card" href="regl.int/LIQUIDEZ_CORRIENTE.pdf" download>
        <div class="icon">📄</div>
        <h2>Reglamento Interno</h2>
      </a>
      <a class="card" id="btnFolletoActual" href="#" download>
        <div class="icon">📑</div>
        <h2>Folleto Comercial</h2>
        <div class="mes-label" id="mesLabel">Cargando...</div>
      </a>
    </div>

    <div class="center-box">
      <div class="card historial-btn" onclick="toggleHistorial()">
        <div class="icon">🗂️</div>
        <h2 style="font-size:0.9rem;">Historial de Folletos</h2>
      </div>
    </div>

    <div class="historial-container" id="historial">
      <div class="select-group">
        <select id="selectMesHistorial">
          <option value="">Selecciona un mes...</option>
        </select>
      </div>
      <button class="download-btn" onclick="descargarHistorial()">
        Descargar Folleto
      </button>
    </div>
  </div>

  <script>
    const REPO       = "mivelascor/fondos-financieros";
    const BRANCH     = "main";
    const NOMBRE_PDF = "FIP_VANTRUST_LIQUIDEZ_CORRIENTE.pdf";

    async function cargarUltimo() {
      try {
        const resp = await fetch(
          `https://api.github.com/repos/${REPO}/contents/folletos`,
          { headers: { "Accept": "application/vnd.github+json" } }
        );
        if (!resp.ok) throw new Error("sin datos");
        const items = await resp.json();
        const meses = items
          .filter(i => i.type === "dir" && /^\d{4}-\d{2}$/.test(i.name))
          .map(i => i.name).sort().reverse();

        const sel = document.getElementById("selectMesHistorial");
        if (meses.length === 0) {
          document.getElementById("mesLabel").textContent = "No disponible aún";
          document.getElementById("btnFolletoActual").classList.add("disabled");
          return;
        }

        // Folleto más reciente
        const ultimo = meses[0];
        const url = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/folletos/${ultimo}/${NOMBRE_PDF}`;
        document.getElementById("btnFolletoActual").href = url;
        document.getElementById("mesLabel").textContent = ultimo;

        // Llenar selector historial
        sel.innerHTML = meses
          .map(m => `<option value="${m}">${m}</option>`)
          .join("");
      } catch(e) {
        document.getElementById("mesLabel").textContent = "No disponible";
        document.getElementById("btnFolletoActual").classList.add("disabled");
      }
    }

    function toggleHistorial() {
      const h = document.getElementById("historial");
      h.style.display = h.style.display === "block" ? "none" : "block";
    }

    function descargarHistorial() {
      const mes = document.getElementById("selectMesHistorial").value;
      if (!mes) { alert("Selecciona un mes"); return; }
      const url = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/folletos/${mes}/${NOMBRE_PDF}`;
      const a = document.createElement("a");
      a.href = url;
      a.download = `${NOMBRE_PDF.replace(".pdf","")} ${mes}.pdf`;
      a.click();
    }

    cargarUltimo();
  </script>
</body>
</html>
